name: Publish HyperMax v2.4.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.4.4.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          TAG="V2.4.4"
          ASSET="HyperMax-v2.4.4-GreenStatus-FastUI.zip"
          STAGE=".release-staging/v2.4.4"

          cat "$STAGE/overlay.part00" "$STAGE/overlay.part01" "$STAGE/overlay.part02" > /tmp/overlay.b64
          test "$(wc -c < /tmp/overlay.b64)" -eq 20196
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.gz
          tar -tzf /tmp/overlay.tar.gz >/dev/null

          curl -fL --retry 3             "https://github.com/CnGyZzh/HyperMax/releases/download/V2.2/HyperMax-v2.2-TouchFix.zip"             -o /tmp/base.zip

          rm -rf /tmp/build
          mkdir -p /tmp/build
          unzip -q /tmp/base.zip -d /tmp/build

          cp /tmp/build/functions/miui-thermal /tmp/miui-thermal
          cp /tmp/build/functions/Eclipse /tmp/Eclipse
          rm -rf /tmp/build/*
          mkdir -p /tmp/build/functions
          cp /tmp/miui-thermal /tmp/build/functions/miui-thermal
          cp /tmp/Eclipse /tmp/build/functions/Eclipse

          tar -xzf /tmp/overlay.tar.gz -C /tmp/build
          chmod 755 /tmp/build/*.sh /tmp/build/functions/miui-thermal /tmp/build/functions/Eclipse
          chmod 644 /tmp/build/module.prop /tmp/build/system.prop
          chmod 644 /tmp/build/state/* /tmp/build/profiles/touch/300.ini /tmp/build/webroot/index.html

          cd /tmp/build
          zip -qr "$GITHUB_WORKSPACE/$ASSET" .
          cd "$GITHUB_WORKSPACE"
          unzip -t "$ASSET" >/dev/null
          sha256sum "$ASSET"

      - name: Publish second release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          HyperMax v2.4.4 · GreenStatus FastUI

          面向 Xiaomi 17 Pro 的高刷、触控与温控一体化调校模块。

          本次更新
          - 修复 KowSU / KernelSU WebUI 状态读取与解析，触控、刷新率、温控可正确显示当前状态
          - 优化 FastUI：切换页面不再触发 Shell，按钮点击先即时反馈，再执行后台脚本
          - 状态读取改为轻量 state 优先，减少重复 SurfaceFlinger / dumpsys 调用
          - 刷新率已核对状态统一显示绿色
          - 保留已验证的全局 144 / 120 / 90 / 60Hz 切换逻辑
          - 保留 300 触控配置，Synaptics 路径已实机验证持续收到 mode 1011 = 300
          - 保留原作者四档温控逻辑，不额外修改 mi_thermald
          - 无常驻轮询，降低 WebUI 与后台额外开销

          注意
          144Hz 并非 Xiaomi 17 Pro 原厂标准刷新率，需要设备已经具备兼容的 144Hz 超频 DTBO / 显示模式。
          HyperMax 不会自动刷写 DTBO。

          高刷新率、触控及温控调校可能增加功耗、发热或影响稳定性，请根据设备实际情况使用。

          - 温控原作者：苏疫杆菌
          - 触控原作者：裤安不太热
          - HyperMax 修改 / 整合 / Xiaomi 17 Pro 适配：Gy

          感谢原作者的工作。
          EOF

          gh release create "V2.4.4"             "HyperMax-v2.4.4-GreenStatus-FastUI.zip"             --title "HyperMax v2.4.4 · GreenStatus FastUI"             --notes-file /tmp/release-notes.md             --target main

      - name: Clean release staging
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .release-staging/v2.4.4
          git rm .github/workflows/release-v2.4.4.yml
          git commit -m "chore: clean v2.4.4 release staging"
          git push
