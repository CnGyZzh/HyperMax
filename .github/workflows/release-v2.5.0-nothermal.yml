name: Publish HyperMax v2.5.0 NoThermal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2.5.0-nothermal.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          STAGE=".release-staging/v2.5.0-nothermal"
          ASSET="HyperMax-v2.5.0-NoThermal-FastUI.zip"
          cat "$STAGE/part00" "$STAGE/part01" "$STAGE/part02" > /tmp/hm.b64
          test "$(wc -c < /tmp/hm.b64)" -eq 21856
          base64 -d /tmp/hm.b64 > "$ASSET"
          test "$(wc -c < "$ASSET")" -eq 16392
          echo "6458988c3cccd8e60c800433d1e85d4d007abc389f511feccbb10030590bd5ea  $ASSET" | sha256sum -c -
          unzip -t "$ASSET" >/dev/null
          unzip -p "$ASSET" module.prop | grep -F "version=v2.5.0"
          unzip -p "$ASSET" module.prop | grep -F "移除温控功能"

      - name: Publish no-thermal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## HyperMax v2.5.0 · 无温控版

          这是 **HyperMax 无温控版**，仅保留 Xiaomi 17 Pro 的触控与刷新率功能。

          ### 本版内容
          - **已移除温控功能**
          - 删除温控页面、温控状态和温控切换入口
          - 删除 thermal.sh、Eclipse、miui-thermal 与温控状态文件
          - 模块运行阶段不再写入或管理温控
          - 从旧版升级时，如检测到 HyperMax 旧温控部署标记，会尝试一次性恢复 OEM 温控配置；之后由系统接管
          - 保留原机 / 300 触控模式
          - 保留全局 144 / 120 / 90 / 60Hz 刷新率切换
          - 保留 Monet WebUI、FastUI 低延迟交互和状态核对优化
          - 无常驻轮询

          > 144Hz 不是 Xiaomi 17 Pro 原厂标准刷新率，需要设备预先具备兼容的 144Hz 超频 DTBO / 显示模式。HyperMax 不会自动刷写 DTBO。

          ### 作者
          - 触控原作者：裤安不太热
          - HyperMax 修改 / 整合 / Xiaomi 17 Pro 适配：Gy
          EOF

          gh release create "V2.5.0-NoThermal"             "HyperMax-v2.5.0-NoThermal-FastUI.zip"             --title "HyperMax v2.5.0 · 无温控版"             --notes-file /tmp/notes.md             --target main

      - name: Clean release staging
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .release-staging/v2.5.0-nothermal
          git rm .github/workflows/release-v2.5.0-nothermal.yml
          git commit -m "chore: clean v2.5.0 no-thermal release staging"
          git push
